name: "Build & push checks"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CACHIX_CHECKS_CACHE: zocker-nix-projects-checks

jobs:
  checks:
    name: "checks.${{ matrix.system }}.*"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux]
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # configure the cache for pulling (substitution) only
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CHECKS_CACHE }}
          skipPush: true

      # build every check and capture the resulting store paths.
      # also push in case of error as some checks may have succeeded and their store paths should be cached.
      - uses: ./.github/actions/build-checks
        id: build
        continue-on-error: true
        with:
          system: ${{ matrix.system }}

      - name: Push to cache
        # push needs secrets; they are only available for same-repo events.
        if: >
          github.repository_owner == 'zocker-nix-projects' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/push-to-cache
        with:
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ env.CACHIX_CHECKS_CACHE }}
          authToken: ${{ secrets.CACHIX_CHECKS_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_CHECKS_SIGNING_KEY }}
