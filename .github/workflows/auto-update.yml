name: "Auto-update flake"

on:
  schedule:
    - cron: "0 3 * * 6"
  workflow_dispatch:

# Prevent overlapping runs from clobbering the shared auto-update branch.
concurrency:
  group: auto-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  CACHIX_CHECKS_CACHE: zocker-nix-projects-checks
  AUTO_UPDATE_BRANCH: auto-update
  PR_TITLE: "chore(deps): update flake lockfile"

jobs:
  auto-update:
    name: "Auto-update flake"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # configure the cache for pulling (substitution) only
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CHECKS_CACHE }}
          skipPush: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Reset the reserved branch to main so the PR always contains exactly
      # one new update commit (the previous one is discarded).
      - name: Reset auto-update branch
        run: |
          git fetch origin
          git checkout -B "$AUTO_UPDATE_BRANCH" origin/main

      - name: Update flake lockfile
        id: update
        continue-on-error: true
        run: |
          nix flake update --commit-lock-file

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet origin/main...HEAD; then
            echo "No lockfile changes."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # Build every check and capture the resulting store paths.
      - name: Build checks
        id: build
        if: steps.changes.outputs.has_changes == 'true'
        continue-on-error: true
        uses: ./.github/actions/build-checks
        with:
          system: x86_64-linux

      - name: Push to cache
        # Push even if some checks failed: build-checks emits the paths of the
        # ones that succeeded, and those should still be uploaded.
        if: steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/push-to-cache
        with:
          paths: ${{ steps.build.outputs.paths }}
          cache: ${{ env.CACHIX_CHECKS_CACHE }}
          authToken: ${{ secrets.CACHIX_CHECKS_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_CHECKS_SIGNING_KEY }}

      - name: Push auto-update branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git push --force origin "$AUTO_UPDATE_BRANCH"

      - name: Create or update PR
        id: pr
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_OK: ${{ steps.update.outcome == 'success' }}
          BUILD_OK: ${{ steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail

          # Draft if the update or the build failed, otherwise a full PR.
          if [[ "$UPDATE_OK" == "true" && "$BUILD_OK" == "true" ]]; then
            DRAFT="false"
          else
            DRAFT="true"
          fi

          # Find an existing open PR from the auto-update branch.
          EXISTING_PR="$(gh pr list --head "$AUTO_UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Overriding existing PR #$EXISTING_PR"
            gh pr edit "$EXISTING_PR" --title "$PR_TITLE"
            CURRENT_DRAFT="$(gh pr view "$EXISTING_PR" --json isDraft --jq '.isDraft')"
            if [[ "$DRAFT" == "true" && "$CURRENT_DRAFT" != "true" ]]; then
              gh pr edit "$EXISTING_PR" --draft
            elif [[ "$DRAFT" == "false" && "$CURRENT_DRAFT" == "true" ]]; then
              gh pr ready "$EXISTING_PR"
            fi
            PR_NUMBER="$EXISTING_PR"
          else
            echo "Creating new PR"
            if [[ "$DRAFT" == "true" ]]; then
              PR_NUMBER="$(gh pr create --base main --head "$AUTO_UPDATE_BRANCH" --title "$PR_TITLE" --body "Automated flake lockfile update." --draft --json number --jq '.number')"
            else
              PR_NUMBER="$(gh pr create --base main --head "$AUTO_UPDATE_BRANCH" --title "$PR_TITLE" --body "Automated flake lockfile update." --json number --jq '.number')"
            fi
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          # Ping the user on failure.
          if [[ "$DRAFT" == "true" ]]; then
            gh pr comment "$PR_NUMBER" --body "@Zocker1999NET the auto-update build failed. See the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
